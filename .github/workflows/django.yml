# Nombre de tu flujo de trabajo (aparecerá en la pestaña "Actions" de GitHub)
name: Django CI

# 1. DISPARADORES (Triggers)
# Cuándo debe ejecutarse este flujo
on:
  # Ejecutar en "push" a la rama main
  push:
    branches: [ "main" ]
  # Ejecutar en "pull requests" que apunten a la rama main
  pull_request:
    branches: [ "main" ]

# 2. TAREAS (Jobs)
jobs:
  build:

    # 3. AMBIENTE
    # En qué tipo de máquina se ejecutará (usamos la última de Ubuntu)
    runs-on: ubuntu-latest
    
    # Definimos la versión de Python que queremos usar
    strategy:
      matrix:
        python-version: ["3.10"]

    # 4. PASOS (Steps)
    # La secuencia de comandos que se ejecutarán
    steps:
      # Paso 1: Descargar tu código del repositorio
      - uses: actions/checkout@v3

      # Paso 2: Configurar el ambiente de Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Paso 3: Instalar las dependencias (usando el archivo que creamos)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Paso 4: Revisar estilo/calidad con Flake8
      - name: Lint with Flake8
        run: |
          flake8 .
          
      # Paso 5: Ejecutar las pruebas con Pytest (usando el test que creamos)
      - name: Test with Pytest
        run: |
          pytest